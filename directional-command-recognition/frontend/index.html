<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live AI Command Demo</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --panel-bg: #282a36;
            --text-color: #f8f8f2;
            --accent-hubert: #50fa7b;
            --accent-whisper: #bd93f9;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .record-btn {
            background-color: #ff5555;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
            user-select: none;
        }
        .record-btn.recording { background-color: #ffb86c; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        .dashboard {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 30px;
        }
        .panel {
            flex: 1;
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        .panel h3 { margin-top: 0; border-bottom: 2px solid #444; padding-bottom: 10px; }
        .metric { font-size: 1.1rem; margin: 10px 0; display: flex; justify-content: space-between;}
        .highlight { font-weight: bold; font-size: 1.3rem; }
        #cmd-a { color: var(--accent-whisper); }
        #cmd-b { color: var(--accent-hubert); }
        .transcription { 
            font-style: italic; 
            font-size: 0.9rem; 
            color: #aaa; 
            margin-top: 5px;
            min-height: 1.2rem;
        }

        .arena {
            width: 100%;
            max-width: 900px;
            height: 300px;
            background: #44475a;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #6272a4;
        }
        .robot {
            width: 60px;
            height: 60px;
            background-color: #8be9fd;
            border-radius: 50%;
            position: absolute;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            box-shadow: 0 0 15px rgba(139, 233, 253, 0.5);
        }
        
        .log-container {
            width: 100%;
            max-width: 900px;
            margin-top: 20px;
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
        }
        .log-entry {
            border-bottom: 1px solid #444;
            padding: 8px 0;
            font-family: monospace;
            font-size: 0.9rem;
        }
        .log-entry:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Live Command Recognition</h1>
        <p>Code-Mixed Sinhala-English Dashboard</p>
    </div>

    <button id="recordBtn" class="record-btn">Hold to Speak</button>

    <div class="dashboard">
        <div class="panel" style="border-top: 4px solid var(--accent-whisper);">
            <h3>Pipeline A: ASR + Semantic</h3>
            <div class="metric">Command: <span id="cmd-a" class="highlight">--</span></div>
            <div id="trans-a" class="transcription">"Waiting for speech..."</div>
            <div class="metric">Confidence: <span id="conf-a">--</span>%</div>
            <div class="metric">Latency: <span id="lat-a">--</span> ms</div>
        </div>
        
        <div class="panel" style="border-top: 4px solid var(--accent-hubert);">
            <h3>Pipeline B: Direct Acoustic</h3>
            <div class="metric">Command: <span id="cmd-b" class="highlight">--</span></div>
            <div class="transcription">&nbsp;</div> <!-- Spacer -->
            <div class="metric">Confidence: <span id="conf-b">--</span>%</div>
            <div class="metric">Latency: <span id="lat-b">--</span> ms</div>
        </div>
    </div>

    <div class="arena">
        <div id="robot" class="robot">🤖</div>
    </div>

    <div class="log-container">
        <h3 style="margin-top:0">Event History</h3>
        <div id="historyLog"></div>
    </div>

    <script>
        const ws = new WebSocket("ws://localhost:8000/ws");
        let mediaRecorder;
        let audioChunks = [];

        const robot = document.getElementById('robot');
        const btn = document.getElementById('recordBtn');
        const log = document.getElementById('historyLog');

        function moveRobot(command) {
            const step = 80;
            switch(command.toLowerCase()) {
                case 'forward':
                    robot.style.transform = `translateY(-${step}px)`;
                    break;
                case 'backward':
                    robot.style.transform = `translateY(${step}px)`;
                    break;
                case 'left':
                    robot.style.transform = `translateX(-${step * 1.5}px)`;
                    break;
                case 'right':
                    robot.style.transform = `translateX(${step * 1.5}px)`;
                    break;
                case 'stop':
                    robot.style.transform = 'translate(0, 0)';
                    break;
            }
        }

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            // Update Pipeline A
            document.getElementById('cmd-a').innerText = data.pipelineA.command.toUpperCase();
            document.getElementById('conf-a').innerText = (data.pipelineA.confidence * 100).toFixed(1);
            document.getElementById('lat-a').innerText = data.pipelineA.latency_ms;
            document.getElementById('trans-a').innerText = `"${data.pipelineA.transcription}"`;

            // Update Pipeline B
            document.getElementById('cmd-b').innerText = data.pipelineB.command.toUpperCase();
            document.getElementById('conf-b').innerText = (data.pipelineB.confidence * 100).toFixed(1);
            document.getElementById('lat-b').innerText = data.pipelineB.latency_ms;

            // Log entry
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const timestamp = new Date().toLocaleTimeString();
            entry.innerText = `[${timestamp}] A: ${data.pipelineA.command} (${data.pipelineA.latency_ms}ms) | B: ${data.pipelineB.command} (${data.pipelineB.latency_ms}ms)`;
            log.prepend(entry);

            // Move robot based on Pipeline A (usually more accurate)
            moveRobot(data.pipelineA.command);
        };

        // Mic Capture
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            mediaRecorder = new MediaRecorder(stream);
            
            mediaRecorder.ondataavailable = e => {
                if (e.data.size > 0) audioChunks.push(e.data);
            };
            
            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                if (ws.readyState === WebSocket.OPEN) {
                    ws.send(audioBlob);
                }
                audioChunks = [];
            };
        }).catch(err => {
            console.error("Mic access denied.", err);
            alert("Please allow microphone access to use the demo.");
        });

        btn.addEventListener('mousedown', () => {
            if (mediaRecorder && mediaRecorder.state === "inactive") {
                btn.classList.add('recording');
                btn.innerText = "Listening...";
                audioChunks = [];
                mediaRecorder.start();
            }
        });

        btn.addEventListener('mouseup', () => {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                btn.classList.remove('recording');
                btn.innerText = "Analyzing...";
                mediaRecorder.stop();
                setTimeout(() => {
                    if (!btn.classList.contains('recording')) {
                        btn.innerText = "Hold to Speak";
                    }
                }, 1000);
            }
        });

        // Touch support
        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            btn.dispatchEvent(new Event('mousedown'));
        });
        btn.addEventListener('touchend', (e) => {
            e.preventDefault();
            btn.dispatchEvent(new Event('mouseup'));
        });

    </script>
</body>
</html>
